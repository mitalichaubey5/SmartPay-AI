spring.application.name=smartpay-backend

# ---------------------------------------------------------------------------
# MySQL connectivity (smartpay_db)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/smartpay_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=5

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server.port=8080

# ---------------------------------------------------------------------------
# Security (Phase 6) — JWT settings. Override JWT_SECRET in production.
# ---------------------------------------------------------------------------security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-seconds=86400

# ---------------------------------------------------------------------------
# PayPal Sandbox (set PAYPAL_CLIENT_ID / PAYPAL_CLIENT_SECRET as env vars)
# When credentials are absent the app runs in clearly-labelled SIMULATED mode.
# return/cancel URLs are where PayPal sends the buyer after approval.
# ---------------------------------------------------------------------------
paypal.base-url=${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
paypal.client-id=${PAYPAL_CLIENT_ID:}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:${PAYPAL_SECRET:}}
paypal.return-url=${PAYPAL_RETURN_URL:http://localhost:5173/}
paypal.cancel-url=${PAYPAL_CANCEL_URL:http://localhost:5173/}

# ---------------------------------------------------------------------------
# SMTP email delivery (set SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASSWORD /
# SMTP_FROM as env vars). When unset, sending an invoice answers
# NOT_CONFIGURED instead of pretending an email was delivered.
# ---------------------------------------------------------------------------
email.host=${SMTP_HOST:}
email.port=${SMTP_PORT:587}
email.username=${SMTP_USER:}
email.password=${SMTP_PASSWORD:}
email.from=${SMTP_FROM:}
email.starttls=${SMTP_STARTTLS:true}

# ---------------------------------------------------------------------------
# AI provider (Google Gemini). Falls back to the built-in natural-language
# invoice parser when no key is configured or the API call fails.
# ---------------------------------------------------------------------------
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
ai.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
